services:
  - type: web
    name: farm-management-system
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: farm_management_db
      - key: SECRET_KEY
        generateValue: true
      - key: FARM_NAME
        value: AgriPulse Smart Farm
      - key: CURRENCY_CODE
        value: UGX
      - key: CURRENCY_SYMBOL
        value: USh
      - key: ITEMS_PER_PAGE
        value: 20
