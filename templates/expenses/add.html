{% extends 'base.html' %}

{% block title %}Record Farm Expense - {{ farm_name }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Record Farm Expenditure</h1>
    <p class="page-desc">Log operating costs, input purchases, fuel, repairs, and labor expenses in UGX</p>
  </div>
  <a href="{{ url_for('expenses.index') }}" class="btn btn-outline">&larr; Back to Expenses</a>
</div>

<div class="card" style="max-width: 840px;">
  <div class="card-body">
    <form method="POST" action="{{ url_for('expenses.add') }}">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="date">Transaction Date *</label>
          <input type="date" id="date" name="date" class="form-control" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="category">Expense Category *</label>
          <select name="category" id="category" class="form-select" required>
            {% for c in categories %}
              <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="amount">Amount (UGX) *</label>
          <input type="number" id="amount" name="amount" class="form-control" 
                 placeholder="e.g. 350000" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="vendor_supplier">Vendor / Supplier / Payee</label>
          <input type="text" id="vendor_supplier" name="vendor_supplier" class="form-control" 
                 placeholder="e.g. Total Energies, Bukoola Chemicals, Shell Mukono">
        </div>

        <div class="form-group">
          <label class="form-label" for="payment_method">Payment Method</label>
          <select name="payment_method" id="payment_method" class="form-select">
            <option value="Cash">Cash in Hand</option>
            <option value="MTN Mobile Money">MTN Mobile Money</option>
            <option value="Airtel Money">Airtel Money</option>
            <option value="Bank Transfer">Bank Transfer / Cheque</option>
            <option value="Supplier Credit Account">Supplier Credit Account</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="receipt_ref">Receipt / Voucher / Invoice Number</label>
          <input type="text" id="receipt_ref" name="receipt_ref" class="form-control" placeholder="e.g. REC-88910">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Expense Description *</label>
        <textarea id="description" name="description" class="form-control" 
                  placeholder="e.g. 100 liters diesel for Massey Ferguson tractor plowing East field..." required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Additional Accounting Notes</label>
        <input type="text" id="notes" name="notes" class="form-control" placeholder="Any tax deduction notes, authorized supervisor...">
      </div>

      <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px;">
        <a href="{{ url_for('expenses.index') }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Expense Record</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
