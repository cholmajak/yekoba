{% extends 'base.html' %}

{% block title %}Page Not Found - {{ farm_name }}{% endblock %}

{% block content %}
<div style="text-align: center; padding: 60px 20px;">
  <h1 style="font-size: 4rem; color: var(--primary); font-weight: 800;">404</h1>
  <h2 style="font-size: 1.5rem; color: var(--text-dark); margin: 12px 0;">Record or Page Not Found</h2>
  <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 24px;">
    The requested farm management page or database document does not exist or has been moved.
  </p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
