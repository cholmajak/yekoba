{% extends 'base.html' %}

{% block title %}Edit {{ item.name }} - {{ farm_name }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Edit SKU: {{ item.name }}</h1>
    <p class="page-desc">Code: <code>{{ item.sku }}</code></p>
  </div>
  <a href="{{ url_for('inventory.index') }}" class="btn btn-outline">&larr; Back to Inventory</a>
</div>

<div class="card" style="max-width: 840px;">
  <div class="card-body">
    <form method="POST" action="{{ url_for('inventory.edit', item_id=str(item._id)) }}">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="name">Item Name *</label>
          <input type="text" id="name" name="name" class="form-control" value="{{ item.name }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="category">Category *</label>
          <select name="category" id="category" class="form-select" required>
            {% for c in categories %}
              <option value="{{ c }}" {% if item.category == c %}selected{% endif %}>{{ c }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="unit">Unit</label>
          <input type="text" id="unit" name="unit" class="form-control" value="{{ item.unit }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="min_stock_level">Minimum Reorder Level *</label>
          <input type="number" step="0.1" id="min_stock_level" name="min_stock_level" class="form-control" value="{{ item.min_stock_level }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="unit_cost_ugx">Unit Cost / Price (UGX)</label>
          <input type="number" id="unit_cost_ugx" name="unit_cost_ugx" class="form-control" value="{{ item.unit_cost_ugx }}">
        </div>

        <div class="form-group">
          <label class="form-label" for="storage_location">Store Location</label>
          <input type="text" id="storage_location" name="storage_location" class="form-control" value="{{ item.storage_location or '' }}">
        </div>

        <div class="form-group">
          <label class="form-label" for="supplier">Supplier</label>
          <input type="text" id="supplier" name="supplier" class="form-control" value="{{ item.supplier or '' }}">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Notes</label>
        <textarea id="notes" name="notes" class="form-control">{{ item.notes or '' }}</textarea>
      </div>

      <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px;">
        <a href="{{ url_for('inventory.index') }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">Update Item</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
