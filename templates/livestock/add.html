{% extends 'base.html' %}

{% block title %}Register Livestock - {{ farm_name }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Register Farm Livestock</h1>
    <p class="page-desc">Add individual tagged cattle, goats, pigs, or batch poultry flocks to the MongoDB database</p>
  </div>
  <a href="{{ url_for('livestock.index') }}" class="btn btn-outline">&larr; Back to Livestock</a>
</div>

<div class="card" style="max-width: 840px;">
  <div class="card-body">
    <form method="POST" action="{{ url_for('livestock.add') }}">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="tracking_type">Tracking Type *</label>
          <select name="tracking_type" id="tracking_type" class="form-select" onchange="toggleBatchQuantity(this.value)">
            <option value="Individual">Individual Animal (Cattle, Goat, Pig, Sheep)</option>
            <option value="Batch">Batch Group (Broiler Poultry, Layers, Chicks)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="animal_type">Animal Type *</label>
          <select name="animal_type" id="animal_type" class="form-select" required>
            <option value="Dairy Cattle">Dairy Cattle</option>
            <option value="Beef Cattle">Beef Cattle</option>
            <option value="Goat">Goat (Boer / Mubende / Small East African)</option>
            <option value="Poultry (Broilers)">Poultry (Broilers)</option>
            <option value="Poultry (Layers)">Poultry (Layers)</option>
            <option value="Pig">Pig (Camborough / Large White)</option>
            <option value="Sheep">Sheep (Dorper / Red Maasai)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="breed">Breed *</label>
          <input type="text" id="breed" name="breed" class="form-control" 
                 placeholder="e.g. Holstein Friesian, Boer, Cobb 500, Camborough" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="tag_number">Tag / Identification Number</label>
          <input type="text" id="tag_number" name="tag_number" class="form-control" 
                 placeholder="e.g. COW-0042 (leave blank to auto-generate)">
        </div>

        <div class="form-group" id="quantityField" style="display: none;">
          <label class="form-label" for="quantity">Flock / Batch Head Count *</label>
          <input type="number" id="quantity" name="quantity" class="form-control" value="100" min="1">
        </div>

        <div class="form-group">
          <label class="form-label" for="gender">Gender</label>
          <select name="gender" id="gender" class="form-select">
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Mixed (Batch)">Mixed (Batch)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="date_of_birth">Date of Birth / Hatch Date</label>
          <input type="date" id="date_of_birth" name="date_of_birth" class="form-control">
        </div>

        <div class="form-group">
          <label class="form-label" for="pen_location">Pen / Barn / Pasture Location *</label>
          <input type="text" id="pen_location" name="pen_location" class="form-control" 
                 placeholder="e.g. Dairy Barn A, Goat Paddock 3, Coop 2" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="health_status">Initial Health Status</label>
          <select name="health_status" id="health_status" class="form-select">
            <option value="Healthy">Healthy & Active</option>
            <option value="Under Treatment">Under Treatment</option>
            <option value="Quarantined">Quarantined / Observation</option>
            <option value="Pregnant">Pregnant / In-calf</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="weight_kg">Weight (kg)</label>
          <input type="number" step="0.1" id="weight_kg" name="weight_kg" class="form-control" placeholder="e.g. 420.5">
        </div>

        <div class="form-group">
          <label class="form-label" for="purchase_price">Purchase Cost (UGX)</label>
          <input type="number" id="purchase_price" name="purchase_price" class="form-control" placeholder="e.g. 2500000">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Pedigree / Source / Health Notes</label>
        <textarea id="notes" name="notes" class="form-control" placeholder="Source farm, sire/dam lineage, vaccination history on arrival..."></textarea>
      </div>

      <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px;">
        <a href="{{ url_for('livestock.index') }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Livestock Record</button>
      </div>
    </form>
  </div>
</div>

<script>
function toggleBatchQuantity(val) {
  const qField = document.getElementById('quantityField');
  if (val === 'Batch') {
    qField.style.display = 'block';
  } else {
    qField.style.display = 'none';
  }
}
</script>
{% endblock %}
