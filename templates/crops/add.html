{% extends 'base.html' %}

{% block title %}Register New Crop - {{ farm_name }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Register New Crop Cycle</h1>
    <p class="page-desc">Add a new crop planting record to MongoDB with field dimensions and inputs</p>
  </div>
  <a href="{{ url_for('crops.index') }}" class="btn btn-outline">&larr; Back to Crops</a>
</div>

<div class="card" style="max-width: 840px;">
  <div class="card-body">
    <form method="POST" action="{{ url_for('crops.add') }}">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="crop_name">Crop Name *</label>
          <input type="text" id="crop_name" name="crop_name" class="form-control" 
                 placeholder="e.g. Maize (Corn), Matooke, Coffee, Cassava" value="{{ (form and form.crop_name) or '' }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="variety">Crop Variety *</label>
          <input type="text" id="variety" name="variety" class="form-control" 
                 placeholder="e.g. Longe 10H, Mpologoma, Robusta NARO 1" value="{{ (form and form.variety) or '' }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="field_plot">Field / Plot Location *</label>
          <input type="text" id="field_plot" name="field_plot" class="form-control" 
                 placeholder="e.g. North Plot - Block 2" value="{{ (form and form.field_plot) or '' }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="growth_status">Initial Growth Status</label>
          <select name="growth_status" id="growth_status" class="form-select">
            <option value="Planted">Planted</option>
            <option value="Vegetative">Vegetative</option>
            <option value="Flowering">Flowering</option>
            <option value="Fruiting">Fruiting</option>
            <option value="Maturing">Maturing</option>
            <option value="Ready for Harvest">Ready for Harvest</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="planting_date">Planting Date *</label>
          <input type="date" id="planting_date" name="planting_date" class="form-control" 
                 value="{{ (form and form.planting_date) or '' }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="expected_harvest_date">Expected Harvest Date</label>
          <input type="date" id="expected_harvest_date" name="expected_harvest_date" class="form-control" 
                 value="{{ (form and form.expected_harvest_date) or '' }}">
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;">
          <div class="form-group">
            <label class="form-label" for="field_size">Field Size *</label>
            <input type="number" step="0.1" id="field_size" name="field_size" class="form-control" 
                   placeholder="e.g. 5.5" value="{{ (form and form.field_size) or '1.0' }}" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="field_size_unit">Unit</label>
            <select name="field_size_unit" id="field_size_unit" class="form-select">
              <option value="Acres">Acres</option>
              <option value="Hectares">Hectares</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;">
          <div class="form-group">
            <label class="form-label" for="quantity_planted">Quantity Seeded / Planted</label>
            <input type="number" step="0.1" id="quantity_planted" name="quantity_planted" class="form-control" 
                   placeholder="e.g. 25" value="{{ (form and form.quantity_planted) or '10' }}">
          </div>
          <div class="form-group">
            <label class="form-label" for="quantity_planted_unit">Unit</label>
            <select name="quantity_planted_unit" id="quantity_planted_unit" class="form-select">
              <option value="kg">kg</option>
              <option value="bags">bags</option>
              <option value="suckers">suckers</option>
              <option value="seedlings">seedlings</option>
              <option value="cuttings">cuttings</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="fertilizer_used">Basal Fertilizers / Soil Amendments</label>
        <input type="text" id="fertilizer_used" name="fertilizer_used" class="form-control" 
               placeholder="e.g. NPK 17:17:17 (50 kg) + Farmyard Manure (2 tons)" value="{{ (form and form.fertilizer_used) or '' }}">
      </div>

      <div class="form-group">
        <label class="form-label" for="notes">Agronomic Notes & Observations</label>
        <textarea id="notes" name="notes" class="form-control" 
                  placeholder="Record spacing, soil moisture conditions, or seed lot numbers...">{{ (form and form.notes) or '' }}</textarea>
      </div>

      <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 10px;">
        <a href="{{ url_for('crops.index') }}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Crop Record</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
